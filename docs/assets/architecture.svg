<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">OpenCMO software architecture</title>
<desc id="desc">React client communicates with FastAPI over REST and server-sent events. Each web process starts an in-process background worker and optional scheduler. SQLite stores application data and the task queue, files store document originals, and optional Qdrant stores vectors. API and workers call external model, collection and publishing providers.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14213b"/></linearGradient>
  <linearGradient id="accent" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#93c5fd" stroke-width="1.4"/></marker>
<marker id="arrow-start" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="0"><path d="M1 7 L4 1 L7 7" fill="none" stroke="#93c5fd" stroke-width="1.4"/></marker>
<marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="0"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#93c5fd" stroke-width="1.4"/></marker>
</defs>
<rect width="1600" height="1110" rx="28" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="64" y="61" fill="#93c5fd" font-size="15" font-weight="600" letter-spacing="2">OPENCMO / SOFTWARE ARCHITECTURE</text>
  <text x="64" y="110" fill="#f8fafc" font-size="36" font-weight="650">One workspace. A persistent growth pipeline.</text>
  <rect x="64" y="132" width="112" height="4" rx="2" fill="url(#accent)"/>
  <rect x="64" y="168" width="1472" height="170" rx="20" fill="#102d46" stroke="#256080"/>
  <text x="88" y="204" fill="#7dd3fc" font-size="14" font-weight="600" letter-spacing="1.2">01 / WEB CLIENT</text>
  <g fill="#f1f5f9" font-size="24" font-weight="600">
    <text x="88" y="248">React 19 + Vite</text><text x="546" y="248">Public pages</text><text x="1030" y="248">Authenticated console</text>
  </g>
  <g fill="#b4c5da" font-size="19">
    <text x="88" y="284">TanStack Query · locale · task SSE</text><text x="546" y="284">Landing · docs links · signup</text><text x="1030" y="284">Lazy routes · reports · graph · RAG</text>
  </g>
  <path d="M310 348 V413" fill="none" stroke="#93c5fd" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="333" y="387" fill="#b4c5da" font-size="17">REST /api/v1 + SSE</text>
  <rect x="64" y="428" width="1000" height="334" rx="20" fill="#171f37" stroke="#6261a4" stroke-dasharray="8 6"/>
  <text x="88" y="466" fill="#c4b5fd" font-size="14" font-weight="600" letter-spacing="1.2">02 / WEB PROCESS — API + IN-PROCESS WORKER</text>
  <rect x="88" y="491" width="450" height="204" rx="15" fill="#202944" stroke="#4d5b7b"/>
  <rect x="566" y="491" width="474" height="204" rx="15" fill="#202944" stroke="#4d5b7b"/>
  <g fill="#f1f5f9" font-size="25" font-weight="600"><text x="112" y="533">FastAPI + domain services</text><text x="590" y="533">Worker + scheduler</text></g>
  <g fill="#b4c5da" font-size="18">
    <text x="112" y="572">Session / bearer · account / project ACL</text>
    <text x="112" y="608">Agents SDK · chat / report orchestration</text>
    <text x="112" y="644">BYOK + account ContextVars</text>
    <text x="590" y="572">Worker: SQLite claim · lease · recovery</text>
    <text x="590" y="608">Scheduled scans: direct provider calls</text>
    <text x="590" y="644">Knowledge maintenance: queued tasks</text>
  </g>
  <text x="88" y="736" fill="#9eaec8" font-size="16">Each process starts a worker; scheduled scans currently bypass the task queue.</text>
  <rect x="1112" y="428" width="424" height="334" rx="20" fill="#14342f" stroke="#39796b"/>
  <text x="1136" y="466" fill="#6ee7b7" font-size="14" font-weight="600" letter-spacing="1.2">03 / EXTERNAL PROVIDERS</text>
  <g fill="#ecfdf5" font-size="23" font-weight="600"><text x="1136" y="531">Model APIs</text><text x="1136" y="610">Collection</text><text x="1136" y="691">Publishing</text></g>
  <g fill="#b4d1c9" font-size="17"><text x="1136" y="564">LLM · embedding · rerank</text><text x="1136" y="643">Crawl4AI · search · communities</text><text x="1136" y="724">Reddit / X · credentials + approval</text></g>
