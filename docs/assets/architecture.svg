  <path d="M310 771 V826" fill="none" stroke="#93c5fd" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="333" y="806" fill="#b4c5da" font-size="17">State / sources / citations</text>
  <path d="M803 771 V826" fill="none" stroke="#93c5fd" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="826" y="806" fill="#b4c5da" font-size="17">Task queue / results / indexing</text>
  <rect x="64" y="843" width="1472" height="184" rx="20" fill="#1e293b" stroke="#475569"/>
  <text x="88" y="880" fill="#cbd5e1" font-size="14" font-weight="600" letter-spacing="1.2">04 / PERSISTENCE</text>
  <g fill="#f8fafc" font-size="24" font-weight="600"><text x="88" y="927">SQLite / WAL / FTS5</text><text x="742" y="927">Document files</text><text x="1150" y="927">Qdrant (optional)</text></g>
  <g fill="#b4c5da" font-size="17">
    <text x="88" y="963">Accounts · projects · reports · approvals · tasks / events</text><text x="88" y="990">ACL · normalized text · versions · source citations</text>
    <text x="742" y="963">Original uploads</text><text x="742" y="990">Persistent application volume</text>
    <text x="1150" y="963">Dense child-passage vectors</text><text x="1150" y="990">SQL revalidates retrieved hits</text>
  </g>
  <path d="M714 898 V999 M1120 898 V999" stroke="#475569"/>
  <text x="64" y="1071" fill="#94a3b8" font-size="16">Current code topology · See architecture.md for boundaries, request flows and deployment notes.</text>
  <text x="1536" y="1071" text-anchor="end" fill="#c7d2fe" font-size="16">Ling / Lling0000</text>
</g>
</svg>
